<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="icon-180.png">
    <link rel="apple-touch-icon" href="icon-180.png">

<meta name="apple-mobile-web-app-title" content="Catalogo AR">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AR Catalog | Cal Mil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-primary: #1d1c1e;
            --text-secondary: #6e6d73;
            --accent: #007aff;
            --accent-hover: #005fc1;
            --border-light: rgba(0, 0, 0, 0.06);
            --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.02);
            --shadow-hover: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s cubic-bezier(0.25, 0.1, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.4;
            padding: 0;
            margin: 0;
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.2rem 1.5rem 3rem;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-light);
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .company-logo {
            height: 48px;
            width: auto;
            max-width: 180px;
            object-fit: contain;
            display: block;
        }

        .logo-text {
            font-weight: 600;
            font-size: 1.7rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-primary) 60%, var(--accent) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            white-space: nowrap;
        }

        .slogan {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }

        .product-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            overflow: hidden;
            border: 0.5px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transform: translateY(0);
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(0, 122, 255, 0.3);
        }

        .image-container {
            background: rgba(0, 0, 0, 0.04);
            position: relative;
            width: 100%;
            padding-top: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
            background: var(--bg-secondary);
            padding: 8px;
        }

        .product-card:hover .product-img {
            transform: scale(1.02);
        }

        .product-info {
            padding: 1.2rem 1.2rem 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .product-sub {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            display: inline-block;
            margin-bottom: 0.65rem;
        }

        .product-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: auto;
        }

        .badge-ar {
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .footer-note {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border-top: 0.5px solid var(--border-light);
            padding-top: 1.8rem;
        }

        @media (max-width: 640px) {
            .app {
                padding: 1rem 1rem 2rem;
            }
            .catalog-grid {
                gap: 1.2rem;
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
            .product-info {
                padding: 0.9rem 0.9rem 1.2rem;
            }
            .product-title {
                font-size: 0.9rem;
            }
            .company-logo {
                height: 35px;
            }
            .logo-text {
                font-size: 1.2rem;
            }
            .product-img {
                padding: 4px;
            }
            .badge-ar {
                font-size: 0.6rem;
                padding: 4px 10px;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .product-card {
            animation: fadeUp 0.5s ease backwards;
        }
    </style>
</head>
<body>

</div>

    ];

    function renderCatalog(productsArray) {
        const gridContainer = document.getElementById('productGrid');
        if (!gridContainer) return;
        if (!productsArray || productsArray.length === 0) {
            gridContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding: 3rem;">✨ No products available ✨</div>`;
            return;
        }
        let cardsHTML = '';
        for (let i = 0; i < productsArray.length; i++) {
            const prod = productsArray[i];
            const imageUrl = prod.imgSrc && prod.imgSrc.trim() !== '' ? prod.imgSrc : 'https://placehold.co/600x600/e9ecef/868e96?text=No+Image';
            const titleText = prod.title || 'Product';
            const subText = prod.subtitle || 'Collection 2026';
            const linkAR = prod.arLink || '#';
            const badgeLabel = prod.badge || 'Tap for AR experience';
            cardsHTML += `
                <div class="product-card" data-ar-link="${linkAR.replace(/"/g, '&quot;')}" data-id="${prod.id || i}">
                    <div class="image-container">
                        <img class="product-img" src="${imageUrl}" alt="${titleText.replace(/"/g, '&quot;')}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${escapeHtml(titleText)}</div>
                        <div class="product-sub">${escapeHtml(subText)}</div>
                        <div class="product-desc">
                            <span class="badge-ar">${escapeHtml(badgeLabel)}</span>
                        </div>
                    </div>
                </div>
            `;
        }
        gridContainer.innerHTML = cardsHTML;
        document.querySelectorAll('.product-card').forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                const arUrl = card.getAttribute('data-ar-link');
                if (arUrl && arUrl !== '#') {
                    window.open(arUrl, '_blank');
                } else {
                    showToast('🔗 Assign an AR link to this product');
                }
            });
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function showToast(message) {
        let existing = document.querySelector('.custom-toast');
        if(existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'custom-toast';
        toast.innerText = message;
        toast.style.position = 'fixed';
        toast.style.bottom = '24px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = 'rgba(0,0,0,0.8)';
        toast.style.backdropFilter = 'blur(20px)';
        toast.style.color = 'white';
        toast.style.padding = '10px 22px';
        toast.style.borderRadius = '100px';
        toast.style.fontSize = '0.85rem';
        toast.style.zIndex = '999';
        toast.style.fontFamily = 'system-ui';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderCatalog(productsData);
        
        const logoImg = document.getElementById('companyLogoImg');
        if(logoImg) {
            logoImg.onerror = function() { this.style.display = 'none'; };
        }
    });
</script>
